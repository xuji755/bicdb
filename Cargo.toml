# bicdb —— 面向 Agent 的用户隔离记忆与资产数据库
# 设计依据：doc/小型多线程数据库总体开发方案_v0.2.md（内部文档，不随此仓库发布）
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2021"
# MSRV：代码可编译的最低 Rust 版本。这是比工具链精确版本更宽松、更稳定的
# 约束——开发人员用任意 >= 1.80 的 stable 均可构建。
#
# P0 冻结（2026-10）：初始值 1.80；由 CI 的 `cargo +1.80 check --workspace`
# 门禁实证；调整走需求变更控制。
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/xuji755/bicdb"
publish = false

[workspace.dependencies]
